<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>CineNova | Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#ba9eff',
              'error-dim': '#d73357',
              surface: '#0e0e0e',
              'primary-fixed-dim': '#a27cff',
              'on-secondary': '#3c4c61',
              outline: '#777575',
              'on-tertiary-fixed': '#380018',
              'primary-fixed': '#ae8dff',
              'tertiary-dim': '#f0779d',
              'surface-container': '#1a1919',
              'on-secondary-fixed': '#29394e',
              'tertiary-container': '#fd81a8',
              'surface-variant': '#262626',
              'secondary-fixed-dim': '#bacae4',
              'secondary-container': '#38485d',
              'on-error': '#490013',
              'on-secondary-fixed-variant': '#46556b',
              'inverse-surface': '#fcf8f8',
              'on-primary-container': '#2b006e',
              'on-tertiary-fixed-variant': '#701039',
              'inverse-primary': '#6e3bd7',
              'outline-variant': '#494847',
              'on-secondary-container': '#c1d1eb',
              'on-tertiary-container': '#59002a',
              'tertiary-fixed': '#ff8eb0',
              'surface-bright': '#2c2c2c',
              'surface-tint': '#ba9eff',
              'primary-dim': '#8455ef',
              'inverse-on-surface': '#565554',
              'error-container': '#a70138',
              secondary: '#c8d8f3',
              tertiary: '#ff97b5',
              'secondary-fixed': '#c8d8f3',
              'on-primary-fixed-variant': '#370086',
              'on-primary': '#39008c',
              'surface-container-lowest': '#000000',
              'surface-container-high': '#201f1f',
              'surface-container-highest': '#262626',
              'on-surface': '#ffffff',
              'on-primary-fixed': '#000000',
              'secondary-dim': '#bacae4',
              'on-surface-variant': '#adaaaa',
              'on-background': '#ffffff',
              'surface-dim': '#0e0e0e',
              'on-error-container': '#ffb2b9',
              'surface-container-low': '#131313',
              'on-tertiary': '#6a0934',
              error: '#ff6e84',
              'primary-container': '#ae8dff',
              background: '#0e0e0e',
              'tertiary-fixed-dim': '#f67ca3',
            },
            fontFamily: {
              headline: ['Manrope'],
              body: ['Inter'],
              label: ['Inter'],
            },
            borderRadius: { DEFAULT: '0.125rem', lg: '0.25rem', xl: '0.5rem', full: '0.75rem' },
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
      .cinematic-bg {
        background-image:
          linear-gradient(to bottom, rgba(14, 14, 14, 0.8), rgba(14, 14, 14, 1)),
          url(https://lh3.googleusercontent.com/aida-public/AB6AXuBb9HuwPIO4I4j3a9EoohxfGHgqgjxfkZSqYjNBauAx-R22cL7VOM6t5fo-P7krmwCe8q0IkqN0E6t_MQnmJdGbfBwh-Wf9Mfw6HZbKHJuwK5XIhbc7bYjMt14PtuLa-4T5L1-NAni82UI-M5LFbTSCjIz_cvfFUZiNsnXJCOpCAhmgQewGSVhFAmkVlM9QeYx9AAAqog0CLE9WhX_c4WJMOeFQLTH0zMo-Mz6rn4cQF3aAhJ-s5gVDZCORxy-zN8yLDKZvkzPcVCGB);
        background-size: cover;
        background-position: center;
      }
      .glass-effect {
        backdrop-filter: blur(20px);
        background-color: rgba(38, 38, 38, 0.6);
      }
    </style>
  </head>
  <body
    class="bg-surface text-on-surface font-body antialiased selection:bg-primary selection:text-on-primary"
  >
    <!-- TopAppBar Component (As mandated by JSON and instructions) -->
    <!-- Suppression logic check: Login page usually suppresses full nav, but user explicitly requested TopAppBar for consistency. Rendering branding only. -->
    <header
      class="fixed top-0 w-full z-50 bg-zinc-950/60 backdrop-blur-2xl shadow-[0_20px_50px_rgba(0,0,0,0.8)]"
    >
      <div
        class="flex justify-between items-center px-12 py-8 w-full font-manrope antialiased tracking-tight"
      >
        <div class="text-3xl font-black tracking-tighter text-white uppercase">CINENOVA</div>
        <div class="flex items-center gap-6">
          <button
            class="text-zinc-500 font-medium hover:text-violet-400 transition-all duration-700 ease-out active:scale-95 transform transition-transform"
          >
            <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
          </button>
          <button
            class="text-zinc-500 font-medium hover:text-violet-400 transition-all duration-700 ease-out active:scale-95 transform transition-transform"
          >
            <span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
          </button>
        </div>
      </div>
      <div class="h-px w-full bg-gradient-to-r from-transparent via-white/5 to-transparent"></div>
    </header>
    <!-- Main Content Canvas -->
    <main
      class="min-h-screen flex items-center justify-center cinematic-bg px-6"
      data-alt="Cinematic background with dark movie theater atmosphere"
    >
      <!-- Auth Container -->
      <div class="w-full max-w-md mt-20">
        <!-- Glass Card -->
        <div class="glass-effect p-10 rounded-xl shadow-2xl relative overflow-hidden">
          <!-- Top Accents -->
          <div
            class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary to-transparent opacity-50"
          ></div>
          <div class="mb-10 text-center">
            <h1 class="font-headline text-4xl font-extrabold tracking-tighter mb-2 text-white">
              WELCOME BACK
            </h1>
            <p
              class="font-label text-[10px] tracking-[0.2em] uppercase text-on-surface-variant opacity-60"
            >
              Enter the screening room
            </p>
          </div>
          <!-- Form -->
          <form class="space-y-6">
            <div class="space-y-1">
              <label
                class="font-label text-[9px] tracking-widest uppercase text-on-surface-variant block mb-2 px-1"
                >Email Address</label
              >
              <input
                class="w-full bg-surface-container-highest border-none rounded-md px-5 py-4 text-on-surface placeholder:text-outline-variant focus:ring-1 focus:ring-primary/40 transition-all outline-none"
                placeholder="auteur@cine.nova"
                type="email"
              />
            </div>
            <div class="space-y-1">
              <div class="flex justify-between items-center mb-2 px-1">
                <label
                  class="font-label text-[9px] tracking-widest uppercase text-on-surface-variant block"
                  >Password</label
                >
                <a
                  class="font-label text-[9px] tracking-widest uppercase text-primary hover:text-primary-fixed transition-colors"
                  href="#"
                  >Forgot?</a
                >
              </div>
              <input
                class="w-full bg-surface-container-highest border-none rounded-md px-5 py-4 text-on-surface placeholder:text-outline-variant focus:ring-1 focus:ring-primary/40 transition-all outline-none"
                placeholder="••••••••"
                type="password"
              />
            </div>
            <button
              class="w-full py-4 bg-gradient-to-r from-primary to-primary-dim text-on-primary-fixed font-headline font-bold text-sm tracking-widest uppercase rounded-md shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all duration-300 mt-4"
              type="submit"
            >
              Login
            </button>
          </form>
          <!-- Divider -->
          <div class="relative my-10 flex items-center">
            <div class="flex-grow h-px bg-white/5"></div>
            <span
              class="px-4 font-label text-[9px] tracking-widest uppercase text-on-surface-variant"
              >OR CONTINUE WITH</span
            >
            <div class="flex-grow h-px bg-white/5"></div>
          </div>
          <!-- Social Logins -->
          <div class="grid grid-cols-2 gap-4">
            <button
              class="flex items-center justify-center gap-3 bg-surface-container-low py-3 rounded-md hover:bg-surface-container-high transition-colors group"
            >
              <span
                class="material-symbols-outlined text-on-surface-variant group-hover:text-white"
                data-icon="cloud"
                >cloud</span
              >
              <span class="font-label text-[10px] tracking-widest uppercase">Google</span>
            </button>
            <button
              class="flex items-center justify-center gap-3 bg-surface-container-low py-3 rounded-md hover:bg-surface-container-high transition-colors group"
            >
              <span
                class="material-symbols-outlined text-on-surface-variant group-hover:text-white"
                data-icon="apple"
                >ios</span
              >
              <span class="font-label text-[10px] tracking-widest uppercase">Apple</span>
            </button>
          </div>
          <!-- Footer Link -->
          <div class="mt-10 text-center">
            <p class="font-label text-[10px] tracking-widest text-on-surface-variant uppercase">
              New Auteur?
              <a class="text-white hover:text-primary transition-colors ml-2 font-bold" href="#"
                >Sign Up Now</a
              >
            </p>
          </div>
        </div>
        <!-- Contextual Metadata / Brand Quote -->
        <div class="mt-8 text-center opacity-30 px-12">
          <p class="font-headline italic text-xs leading-relaxed text-on-surface-variant">
            "Every great film should seem new every time you see it." — Robert Bresson
          </p>
        </div>
      </div>
    </main>
    <!-- Footer Component (As per JSON) -->
    <footer
      class="w-full py-16 mt-32 bg-zinc-950 border-t border-white/5 flex flex-col items-center justify-center gap-4"
    >
      <div class="flex gap-8 mb-4">
        <a
          class="font-inter text-[9px] tracking-widest uppercase text-zinc-500 hover:opacity-100 transition-opacity"
          href="#"
          >Manifesto</a
        >
        <a
          class="font-inter text-[9px] tracking-widest uppercase text-zinc-500 hover:opacity-100 transition-opacity"
          href="#"
          >Privacy</a
        >
        <a
          class="font-inter text-[9px] tracking-widest uppercase text-zinc-500 hover:opacity-100 transition-opacity"
          href="#"
          >Terms</a
        >
      </div>
      <p class="font-inter text-[9px] tracking-widest uppercase opacity-40 text-zinc-500">
        © 2024 CINENOVA. THE DIGITAL AUTEUR EXPERIENCE.
      </p>
    </footer>
  </body>
</html>
